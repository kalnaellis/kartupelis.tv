<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Le Burger Builder Â· French â‡„ Latvian</title>
  <style>
    :root {
      --paper: #fff7e7;
      --paper-2: #fff2cf;
      --ink: #263357;
      --blue: #3559d8;
      --green: #3ea055;
      --yellow: #f0cf4d;
      --red: #d6534d;
      --brown: #724a30;
      --cream: #ffeec5;
      --shadow: 0 18px 50px rgba(27, 24, 20, 0.18);
      --radius: 26px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top, #d6ecff 0%, #c6e6ff 24%, #f7e9be 78%, #f2dca8 100%);
      font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif;
      color: var(--ink);
      touch-action: manipulation;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(85, 65, 34, 0.06) 0.8px, transparent 0.9px),
        radial-gradient(rgba(85, 65, 34, 0.03) 0.7px, transparent 0.8px);
      background-size: 22px 22px, 31px 31px;
      background-position: 0 0, 11px 13px;
      opacity: 0.28;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .ui {
      position: absolute;
      inset: 0;
      padding:
        calc(14px + env(safe-area-inset-top))
        calc(14px + env(safe-area-inset-right))
        calc(14px + env(safe-area-inset-bottom))
        calc(14px + env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
      pointer-events: none;
    }

    .top-row,
    .mission-row,
    .tray-row,
    .bottom-row {
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    .top-row {
      display: grid;
      grid-template-columns: minmax(260px, 420px) auto;
      align-items: start;
      gap: 12px;
    }

    .paper, .pill, .ingredient-btn, .modal {
      position: relative;
      pointer-events: auto;
      border-radius: var(--radius);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.72), rgba(255,255,255,0.18)),
        linear-gradient(180deg, var(--paper), var(--paper-2));
      box-shadow: var(--shadow);
      border: 3px solid rgba(87, 68, 32, 0.10);
      overflow: hidden;
    }

    .paper::before,
    .ingredient-btn::before,
    .modal::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(97, 77, 44, 0.06) 0.8px, transparent 1px),
        radial-gradient(rgba(97, 77, 44, 0.04) 0.7px, transparent 0.8px);
      background-size: 22px 22px, 29px 29px;
      background-position: 0 0, 9px 10px;
      opacity: 0.45;
    }

    .brand-card {
      padding: 14px 18px 12px;
      min-height: 112px;
    }

    .brand-card > * { position: relative; z-index: 1; }

    .title {
      margin: 0;
      font-family: "Segoe Print", "Comic Sans MS", cursive;
      font-size: clamp(2rem, 3vw, 2.9rem);
      line-height: 0.92;
      color: #2d4bb1;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 8px;
      font-family: "Segoe Print", "Comic Sans MS", cursive;
      font-size: 0.98rem;
      color: rgba(38, 51, 87, 0.78);
    }

    .crayon-line {
      height: 10px;
      border-radius: 999px;
      margin: 10px 0 10px;
      background: linear-gradient(90deg,
        transparent 0%, transparent 4%,
        var(--green) 4%, var(--green) 48%,
        var(--red) 48%, var(--red) 72%,
        var(--yellow) 72%, var(--yellow) 96%,
        transparent 96%);
      opacity: 0.95;
    }

    .tiny-burger {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 82px;
      height: 82px;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.10));
    }

    .control-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      align-items: flex-start;
    }

    .toggle {
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 250, 236, 0.92);
      box-shadow: var(--shadow);
      border: 2px solid rgba(71, 58, 28, 0.08);
      pointer-events: auto;
    }

    button {
      appearance: none;
      border: none;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      border-radius: 999px;
      padding: 11px 16px;
      color: var(--ink);
      background: linear-gradient(180deg, #fffdf8, #ede7d3);
      box-shadow: 0 6px 14px rgba(36, 38, 52, 0.12);
      transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px) scale(0.985); }

    .lang-btn.active,
    .ghost-btn.active {
      background: linear-gradient(180deg, #eef4ff, #dce8ff);
      color: #2d4bb1;
      outline: 3px solid rgba(53, 89, 216, 0.18);
    }

    .speak-btn {
      background: linear-gradient(180deg, #fff9ea, #ffe7b9);
      color: #7f560d;
      pointer-events: auto;
    }

    .mission-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .mission-card {
      width: min(780px, calc(100vw - 32px));
      padding: 16px 20px 15px;
      text-align: center;
    }

    .mission-card > * { position: relative; z-index: 1; }

    .mission-label {
      font-size: 0.82rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      opacity: 0.62;
      font-weight: 900;
    }

    .mission-main {
      margin-top: 6px;
      font-size: clamp(1.55rem, 3vw, 2.5rem);
      line-height: 1.06;
      font-weight: 900;
      color: #2e4cb2;
    }

    .mission-sub {
      margin-top: 7px;
      font-size: 1rem;
      line-height: 1.35;
      font-weight: 700;
      opacity: 0.82;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      pointer-events: none;
    }

    .hud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      pointer-events: none;
    }

    .pill {
      padding: 10px 14px;
      font-weight: 900;
      font-size: 0.95rem;
      pointer-events: auto;
    }

    .corner-note {
      padding: 10px 14px;
      font-weight: 900;
      color: #2f4bb2;
      pointer-events: none;
      white-space: nowrap;
    }

    .tray-row {
      align-self: end;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      pointer-events: none;
    }

    .ingredient-btn {
      min-height: 124px;
      padding: 10px 10px 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      text-align: center;
      user-select: none;
      transform-origin: center bottom;
    }

    .ingredient-btn > * { position: relative; z-index: 1; }

    .ingredient-btn.correct {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.76), rgba(255,255,255,0.20)),
        linear-gradient(180deg, #f0fff1, #d9f6dc);
      border-color: rgba(62, 160, 85, 0.35);
    }

    .ingredient-btn.wrong {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.76), rgba(255,255,255,0.20)),
        linear-gradient(180deg, #fff5f4, #ffe2df);
      border-color: rgba(214, 83, 77, 0.34);
    }

    .ingredient-btn.dim {
      opacity: 0.72;
    }
